name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,workbench]"
      - run: bash -n tools/workbench.sh
      - run: python tools/check_integrated_repository.py
      - run: python -m pytest

  workbench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: camerae2e-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: camerae2e-workbench/package-lock.json
      - run: npm ci
      - run: npm run build
